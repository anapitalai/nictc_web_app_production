<svg xmlns="http://www.w3.org/2000/svg" width="120mm" height="50mm" viewBox="0 0 1200 500" role="img" aria-labelledby="cap-title cap-description">
  <title id="cap-title">Napitalai ICTC cap front</title>
  <desc id="cap-description">White N monogram with integrated A and NAPITALAI ICTC lettering on a rounded navy-to-deep-teal panel, sized for a 120 by 50 millimeter cap print.</desc>
  <defs>
    <linearGradient id="cap-background" x1="0%" y1="0%" x2="100%" y2="65%">
      <stop offset="0%" stop-color="#0B1C38"/>
      <stop offset="100%" stop-color="#155765"/>
    </linearGradient>
    <linearGradient id="brand-background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1C38"/>
      <stop offset="100%" stop-color="#155765"/>
    </linearGradient>
  </defs>
  <rect x="20" y="20" width="1160" height="460" rx="85" fill="url(#cap-background)"/>
  <svg x="78" y="90" width="320" height="320" viewBox="0 0 320 320" aria-hidden="true">
    <rect width="320" height="320" rx="69" fill="url(#brand-background)"/>
    <path d="M90 246 V74 L230 246 V74" fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M101 191 H184" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  </svg>
  <rect x="78" y="90" width="320" height="320" rx="69" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="5"/>
  <path d="M436 117 V383" stroke="#FFFFFF" stroke-opacity=".65" stroke-width="6" stroke-linecap="round"/>
  <text x="475" y="240" fill="#FFFFFF" font-family="Noto Sans Condensed, Noto Sans, sans-serif" font-size="131" font-weight="700" letter-spacing="3">NAPITALAI</text>
  <path d="M480 275 H1118" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="5" stroke-linecap="round"/>
  <text x="480" y="372" fill="#FFFFFF" font-family="Noto Sans Condensed, Noto Sans, sans-serif" font-size="104" font-weight="700" letter-spacing="18">ICTC</text>
</svg>
