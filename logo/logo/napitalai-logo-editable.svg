<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="400" viewBox="0 0 1440 400" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">Napitalai</title>
  <desc id="logo-description">Napitalai Information, Communication Technology and Training Consultancy. White N monogram and company lettering on a background blending navy into deep teal.</desc>
  <defs>
    <linearGradient id="brand-background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1C38"/>
      <stop offset="100%" stop-color="#155765"/>
    </linearGradient>
  </defs>
  <g transform="translate(40 40)">
    <rect width="320" height="320" rx="69" fill="url(#brand-background)"/>
    <path d="M90 246 V74 L230 246 V74" fill="none" stroke="#FFFFFF" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M101 191 H184" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round"/>
  </g>
  <rect x="374" y="40" width="1026" height="320" rx="69" fill="url(#brand-background)"/>
  <text x="410" y="182" fill="#FFFFFF" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="116" font-weight="700" letter-spacing="-4">Napitalai</text>
  <path d="M414 217 H1356" fill="none" stroke="#FFFFFF" stroke-opacity=".3" stroke-width="3"/>
  <path d="M414 217 H508" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <g fill="#FFFFFF" font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="30" font-weight="600" letter-spacing="2">
    <text x="414" y="270">INFORMATION, COMMUNICATION TECHNOLOGY</text>
    <text x="414" y="318">AND TRAINING CONSULTANCY</text>
  </g>
</svg>
